# Production reverse proxy. This is the ONLY container with published
# ports in docker-compose.prod.yml — frontend, backend-core, ai-service,
# postgres, and redis all stay on the internal Docker network.
#
# That's not just a simplification: because the frontend talks to
# backend-core and ai-service entirely server-side (the BFF pattern from
# Phase 3 — see frontend/lib/backend.ts), nothing external ever needs a
# direct route to them. Fewer exposed surfaces, not just fewer nginx
# blocks.
#
# Replace YOUR_DOMAIN below before using this. Cert paths assume certbot's
# default layout (see docs/DEPLOYMENT.md for the one-time issuance step).

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/css application/javascript application/json image/svg+xml;

    upstream frontend {
        server frontend:3000;
    }

    # Plain HTTP: only serves the ACME challenge for cert issuance/renewal,
    # everything else redirects to HTTPS.
    server {
        listen 80;
        server_name YOUR_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name YOUR_DOMAIN;

        ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Baseline security headers — not exhaustive, but a reasonable default.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js server actions and streaming responses need these.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
        }
    }

    # --- Optional: direct external API access -----------------------------
    # Uncommented, this exposes backend-core's REST API directly (e.g. for
    # a future mobile app). Off by default — the web app never needs it,
    # since the frontend calls backend-core over the internal network.
    #
    # location /api/ {
    #     proxy_pass http://backend-core:8080/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
