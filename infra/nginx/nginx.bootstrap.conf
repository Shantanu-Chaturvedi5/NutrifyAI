# Used ONCE, before you have a certificate yet — nginx.conf (the real
# config) references cert files that don't exist on a fresh server, so
# nginx refuses to start with it. Boot with this HTTP-only config first,
# issue the cert, then switch to nginx.conf. See docs/DEPLOYMENT.md.

events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name YOUR_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
