version: "3.9"

# Production stack. Differences from docker-compose.yml (dev):
#   - Only nginx publishes ports (80/443). Everything else — postgres,
#     redis, backend-core, ai-service, frontend — is internal-network-only.
#     This is possible specifically because the frontend's BFF layer talks
#     to the other services server-side; nothing external needs a direct
#     route to them.
#   - restart: always (dev uses unless-stopped, fine for a laptop; a
#     server should come back up on its own after a reboot).
#   - Rough memory limits, so one runaway container (paddleocr's model
#     loading is the likely culprit) can't take the whole box down.
#   - Named volumes for Postgres data and Let's Encrypt certs.
#
# See docs/DEPLOYMENT.md for the full setup walkthrough (DNS, first-time
# cert issuance, secrets, backups).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nutrifyai-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    container_name: nutrifyai-redis
    restart: always
    mem_limit: 256m

  backend-core:
    build:
      context: ./backend-core
    container_name: nutrifyai-backend-core
    restart: always
    env_file:
      - ./backend-core/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://ai-service:8000
    mem_limit: 1g

  ai-service:
    build:
      context: ./ai-service
    container_name: nutrifyai-ai-service
    restart: always
    env_file:
      - ./ai-service/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKEND_CORE_URL: http://backend-core:8080/api/v1
    # If your LLM_PROVIDER is ollama and Ollama runs on the host (not
    # containerized), the host needs to be reachable from here:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 2g

  frontend:
    build:
      context: ./frontend
    container_name: nutrifyai-frontend
    restart: always
    env_file:
      - ./frontend/.env.production
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend-core:8080/api/v1
    depends_on:
      - backend-core
    mem_limit: 512m

  nginx:
    image: nginx:1.27-alpine
    container_name: nutrifyai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
    mem_limit: 128m

  # Renews the Let's Encrypt cert every 12h (a no-op unless it's actually
  # close to expiry). First issuance is a one-time manual step — see
  # docs/DEPLOYMENT.md — this container only handles renewal.
  certbot:
    image: certbot/certbot:latest
    container_name: nutrifyai-certbot
    restart: always
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:
