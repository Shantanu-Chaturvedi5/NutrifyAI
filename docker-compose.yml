version: "3.9"

# Nouriq — local development stack.
#
# Ollama is NOT containerized here on purpose: you already have it running
# on the host. ai-service reaches it via OLLAMA_BASE_URL (see ai-service/.env).
# On Docker Desktop (Mac/Windows) host.docker.internal resolves automatically.
# On Linux, uncomment the extra_hosts block on ai-service below.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nutrifyai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrifyai}
      POSTGRES_USER: ${POSTGRES_USER:-nutrifyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrifyai_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrifyai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nutrifyai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend-core:
    build:
      context: ./backend-core
    container_name: nutrifyai-backend-core
    restart: unless-stopped
    env_file:
      - ./backend-core/.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrifyai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrifyai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nutrifyai_dev_password}
      SPRING_REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://ai-service:8000
    volumes:
      - local_uploads:/app/data/uploads

  ai-service:
    build:
      context: ./ai-service
    container_name: nutrifyai-ai-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 10g
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nutrifyai}:${POSTGRES_PASSWORD:-nutrifyai_dev_password}@postgres:5432/${POSTGRES_DB:-nutrifyai}
      FLAGS_fraction_of_cpu_memory_to_use: "0.1"
    volumes:
      - local_uploads:/app/data/uploads
      - paddleocr_models:/home/app/.paddleocr
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"   # uncomment on Linux so Ollama on the host is reachable
  frontend:
    build:
      context: ./frontend
    container_name: nutrifyai-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend-core
    environment:
      BACKEND_INTERNAL_URL: http://backend-core:8080/api/v1
      HOSTNAME: "0.0.0.0"

volumes:
  postgres_data:
  local_uploads:
  paddleocr_models: