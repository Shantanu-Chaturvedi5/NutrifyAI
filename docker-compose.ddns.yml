services:
  nginx:
    profiles:
      - custom-domain

  certbot:
    profiles:
      - custom-domain

  caddy:
    image: caddy:2-alpine
    container_name: nutrifyai-caddy
    restart: always
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    mem_limit: 128m

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: nutrifyai-duckdns
    restart: always
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:?Set DUCKDNS_SUBDOMAIN in .env.production}
      TOKEN: ${DUCKDNS_TOKEN:?Set DUCKDNS_TOKEN in .env.production}
      UPDATE_IP: ipv4
      LOG_FILE: "false"
    mem_limit: 64m

volumes:
  caddy_data:
  caddy_config:
